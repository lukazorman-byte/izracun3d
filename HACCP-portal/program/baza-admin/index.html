<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urejevalnik baze HACCP</title>
<style>
:root{--bg:#f6f7f5;--fg:#1d2420;--card:#fff;--line:#d9ded8;--acc:#2f6f4f;--acc2:#e8f1ec;--bad:#b3342b;--ok:#2f6f4f}
@media (prefers-color-scheme:dark){:root{--bg:#161a17;--fg:#e6ebe7;--card:#202622;--line:#36403a;--acc:#6fbf94;--acc2:#24342b;--bad:#e06a5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:18px}header a{color:var(--acc)}
#status{margin-left:auto;font-size:13px}
main{display:grid;grid-template-columns:230px 1fr;gap:14px;padding:14px;max-width:1500px;margin:auto}
@media(max-width:850px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;color:var(--fg);border:0;border-radius:6px;padding:8px 10px;font:inherit;cursor:pointer}
nav button.on{background:var(--acc2);font-weight:600}
nav small{opacity:.6}
button.b{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
button.s{background:var(--acc2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button.d{background:none;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
input,select,textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:13px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
.hint{font-weight:400;opacity:.65;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.bar input{max-width:280px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--acc2);position:sticky;top:0}
tr.row{cursor:pointer}tr.row:hover td{background:var(--acc2)}tr.sel td{background:var(--acc2)}
.wrap{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.err{color:var(--bad);font-size:13px}
.dirty{color:var(--bad);font-weight:600}
.clean{color:var(--ok)}
code{background:var(--acc2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
 <h1>Urejevalnik baze HACCP</h1>
 <a href="/">← Aplikacija</a>
 <span id="status">Nalaganje …</span>
 <button class="s" id="upd" title="Uvozi paket posodobitve (.json)">Uvozi posodobitev</button><input type="file" id="updf" accept=".json,application/json" hidden><button class="b" id="save" disabled>Shrani spremembe v bazo</button>
</header>
<main>
 <div><nav class="card" id="nav"></nav><div class="card" id="hist" style="margin-top:12px;font-size:12px"></div></div>
 <section>
  <div class="card">
   <div class="bar"><b id="title"></b><input id="q" placeholder="Iskanje …"><button class="s" id="add">+ Nov zapis</button><button class="s" id="rawb">JSON</button></div>
   <div class="wrap"><table id="tbl"></table></div>
  </div>
  <div class="card" id="edit" style="margin-top:14px;display:none"></div>
  <div class="card" id="raw" style="margin-top:14px;display:none">
   <p class="hint">Neposredno urejanje celotne zbirke kot JSON. Po potrditvi se spremembe prenesejo v tabelo; v bazo se zapišejo šele z »Shrani«.</p>
   <textarea id="rawt" style="min-height:300px"></textarea>
   <div class="bar" style="margin-top:8px"><button class="b" id="rawok">Uporabi JSON</button><span class="err" id="rawerr"></span></div>
  </div>
 </section>
</main>
<script>
// ---- opis polj posamezne zbirke ----
// tip: t=besedilo, n=število (ali prazno), a=večvrstično, tags=seznam z vejicami, lines=seznam po vrsticah, rows=vrstice z ločilom |, sel=izbira
const SPEC={
 navodila_predloge:{naziv:"Predloge navodil",cols:["id","naslov","verzija","posodobljeno"],f:[
  {k:"id",l:"ID",t:"t"},{k:"naslov",l:"Naslov",t:"t"},{k:"vrsta",l:"Vrsta",t:"t"},
  {k:"dejavnosti",l:"Dejavnosti (ključne besede ali *)",t:"tags",hint:"npr. Gostinstvo, Catering, Pekarna; * = vse"},
  {k:"namen",l:"Namen",t:"a"},{k:"obseg",l:"Obseg",t:"a"},{k:"odgovornosti",l:"Odgovornosti",t:"a"},
  {k:"postopek",l:"Postopek (en korak na vrstico)",t:"lines"},{k:"pogostost",l:"Pogostost",t:"a"},{k:"ukrepi",l:"Ukrepi ob odstopanju",t:"a"},
  {k:"evidence",l:"Evidence",t:"a"},{k:"zakoni",l:"Predpisi iz zbirke zakonodaje",t:"zrows",hint:"Vrstica: točen naziv predpisa (kot v zbirki Zakonodaja) | člen/priloga. Status in datum preverjanja se prevzameta iz baze."},
  {k:"reference",l:"Druge reference (ena na vrstico)",t:"lines"},
  {k:"verzija",l:"Različica",t:"t"},{k:"posodobljeno",l:"Posodobljeno (LLLL-MM-DD)",t:"t"},{k:"opomba",l:"Opomba",t:"a"}]},
 branze:{naziv:"Branže",cols:["id","naziv"],f:[
  {k:"id",l:"ID (brez presledkov)",t:"t",hint:"Ne spreminjajte ID pri obstoječi branži brez potrebe."},
  {k:"naziv",l:"Naziv",t:"t"},
  {k:"oznake",l:"Oznake zakonodaje",t:"tags",hint:"npr. animal, meat, add, plant, bakery. Določajo, kateri predpisi veljajo."},
  {k:"rezimi",l:"Privzeti temperaturni režimi (ID)",t:"tags",hint:"npr. zam, hl4, kuh"},
  {k:"koraki",l:"Faze procesa",t:"lines",hint:"ena faza v vrstici"},
  {k:"nevarnosti",l:"Analiza nevarnosti",t:"rows",cols:["faza","tip","nevarnost","ukrep","ccp"],hint:"Vrstica: faza | tip (B/K/F/P/A) | nevarnost | kontrolni ukrep | CCP (da/ne)"},
  {k:"mikro",l:"Zakonska merila za branžo",t:"arows",hint:"Vrstica: parameter | merilo | vir"}]},
 zakonodaja:{naziv:"Zakonodaja",cols:["skupina","predpis","oznake","status"],f:[
  {k:"skupina",l:"Področje",t:"t",hint:"npr. 1. Splošna živilska zakonodaja in higiena (določa razvrstitev v dokumentu)"},
  {k:"predpis",l:"Predpis",t:"t"},
  {k:"vsebina",l:"Vsebina",t:"a"},
  {k:"oznake",l:"Oznake (kdaj velja)",t:"tags",hint:"* = vedno; branžne oznake; zastavice (bio, add, gmo …); std_haccp, std_iso22000, std_fssc, std_ifs, std_brc; proto, rte"},
  {k:"zakaj",l:"Zakaj velja",t:"t"},
  {k:"status",l:"Status",t:"sel",opts:["veljaven","razveljavljen"],hint:"Razveljavljeni predpisi se v dokumentaciji ne prikažejo"},
  {k:"preverjeno",l:"Zadnje preverjanje",t:"t",hint:"LLLL-MM-DD"}]},
 rezimi:{naziv:"Temperaturni režimi",cols:["id","naziv","od","do"],f:[
  {k:"id",l:"ID",t:"t",hint:"Aplikacija uporablja ID: zam, hl0, hl4, hl6, hl8, sob, kuh, hlaj, vro, pon. Teh ne preimenujte."},
  {k:"naziv",l:"Naziv",t:"t"},{k:"od",l:"Od (°C)",t:"n"},{k:"do",l:"Do (°C, lahko prazno)",t:"n"},
  {k:"predloga",l:"Predloga prikaza",t:"t",hint:"{od} in {do} se nadomestita z vrednostma"},{k:"uporaba",l:"Uporaba",t:"t"}]},
 standardi:{naziv:"Standardi",cols:["id","naziv","razdelki"],f:[
  {k:"id",l:"ID",t:"t",hint:"haccp, iso22000, fssc, ifs, brc (oznaka std_<ID> v zakonodaji)"},{k:"naziv",l:"Naziv",t:"t"},
  {k:"razdelki",l:"Razdelki v dokumentaciji",t:"tags",hint:"haccp, prp, oprp, qms, defence, fraud, alerg"}]},
 zastavice:{naziv:"Lastnosti izdelka",cols:["id","naziv"],f:[{k:"id",l:"ID (oznaka)",t:"t"},{k:"naziv",l:"Naziv",t:"t"}]},
 sestavine:{naziv:"Sestavine",cols:["naziv","skupina","alergeni"],f:[
  {k:"naziv",l:"Naziv sestavine",t:"t"},
  {k:"skupina",l:"Skupina",t:"t",hint:"npr. Meso (surovo), Mleko in mlečni izdelki, Aditivi in pomožne snovi"},
  {k:"alergeni",l:"Alergeni",t:"tags",hint:"Natančno kot v zbirki Alergeni, ločeno z vejicami (npr. Mleko, Soja)"},
  {k:"oznake",l:"Oznake zakonodaje",t:"tags",hint:"npr. animal, meat, add, honey, eudr. Sprožijo ustrezne predpise v dokumentaciji."},
  {k:"nevarnosti",l:"Nevarnosti iz sestavine",t:"hrows",hint:"Vrstica: tip (B/K/F/P/A) | nevarnost | kontrolni ukrep"},
  {k:"hranilne",l:"Hranilne vrednosti na 100 g",t:"nutr",hint:"mast | nasičene | OH | sladkorji | vlaknine | beljakovine | sol | alkohol | polioli (vse v g na 100 g; OH = ogljikovi hidrati brez vlaknin; izpustite, če podatkov ni)"},
  {k:"prevzem",l:"Zahteve ob prevzemu",t:"a"},
  {k:"opomba",l:"Opomba",t:"t"}]},
 obrazci:{naziv:"Obrazci",cols:["oznaka","naziv","skupina","pogostost"],f:[
  {k:"oznaka",l:"Oznaka",t:"t"},{k:"naziv",l:"Naziv obrazca",t:"t"},
  {k:"skupina",l:"Področje",t:"t",hint:"npr. Osebje in usposabljanje"},
  {k:"namen",l:"Namen",t:"a"},{k:"pogostost",l:"Pogostost izpolnjevanja",t:"t"},
  {k:"standardi",l:"Povezava s standardi",t:"srows",hint:"Vrstica: ID standarda | klavzula (ID: haccp, iso22000, fssc, ifs, brc)"},
  {k:"glava",l:"Dodatna polja nad tabelo (glava)",t:"lines",hint:"ena v vrstici, neobvezno"},
  {k:"stolpci",l:"Stolpci tabele",t:"lines",hint:"en stolpec v vrstici"},
  {k:"vrstice",l:"Število praznih vrstic",t:"n"},
  {k:"opomba",l:"Opomba",t:"t"}]},
 presoje:{naziv:"Vprašanja za presoje",cols:["standard","podrocje","vprasanje","klavzula"],f:[
  {k:"standard",l:"Kontrolni seznam",t:"sel",opts:["haccp","prp","iso22000","fssc","ifs","brc","dobavitelj"],hint:"haccp = HACCP načrt, prp = predpogojni programi, dobavitelj = presoja dobavitelja"},
  {k:"podrocje",l:"Področje",t:"t"},{k:"vprasanje",l:"Zahteva / vprašanje",t:"a"},{k:"klavzula",l:"Klavzula / vir",t:"t"}]},
 alergeni:{naziv:"Alergeni",cols:["naziv"],f:[{k:"naziv",l:"Naziv",t:"t"}]},
 prostori:{naziv:"Privzeti prostori",cols:["naziv","cona"],f:[{k:"naziv",l:"Naziv",t:"t"},{k:"cona",l:"Cona",t:"sel",opts:["Nečista","Vmesna","Čista","Pomožna"]}]},
 tipi:{naziv:"Tipi nevarnosti",cols:["koda","naziv"],f:[{k:"koda",l:"Koda",t:"t"},{k:"naziv",l:"Naziv",t:"t"}]},
 mikro:{naziv:"Splošna mikrobiološka merila",cols:["parameter","merilo","vir"],f:[{k:"parameter",l:"Parameter",t:"t"},{k:"merilo",l:"Merilo",t:"a"},{k:"vir",l:"Vir",t:"t"}]}
};
const $=id=>document.getElementById(id);
let DB={},cur="branze",selIdx=-1,dirty=new Set();

const txt=v=>Array.isArray(v)?v.join(", "):v&&typeof v==="object"?JSON.stringify(v):String(v??"");
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else e[k]=v}kids.forEach(c=>e.append(c));return e}

// pretvorbe vrednost <-> besedilo v obrazcu
const enc={
 t:v=>v??"",n:v=>v??"",a:v=>v??"",sel:v=>v??"",
 tags:v=>(v||[]).join(", "),lines:v=>(v||[]).join("\n"),
 rows:(v,f)=>(v||[]).map(r=>[r.faza,r.tip,r.nevarnost,r.ukrep,r.ccp?"da":"ne"].join(" | ")).join("\n"),
 arows:v=>(v||[]).map(r=>r.join(" | ")).join("\n"),
 zrows:v=>(v||[]).map(r=>[r.predpis,r.mesto||""].join(" | ")).join("\n"),
 hrows:v=>(v||[]).map(r=>[r.tip,r.nevarnost,r.ukrep].join(" | ")).join("\n"),
 srows:v=>(v||[]).map(r=>r.std+" | "+r.ref).join("\n"),
 nutr:v=>v?[v.mast,v.nasicene,v.oh,v.sladkorji,v.vlaknine,v.beljakovine,v.sol,v.alkohol||0,v.poliol||0].join(" | "):""
};
const dec={
 t:s=>s.trim(),a:s=>s.trim(),sel:s=>s,n:s=>s.trim()===""?"":Number(s),
 tags:s=>s.split(",").map(x=>x.trim()).filter(Boolean),
 lines:s=>s.split("\n").map(x=>x.trim()).filter(Boolean),
 rows:s=>s.split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());return{faza:p[0]||"",tip:p[1]||"B",nevarnost:p[2]||"",ukrep:p[3]||"",ccp:/^(da|1|true)$/i.test(p[4]||"")}}),
 srows:s=>s.split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{const i=l.indexOf("|");return i<0?{std:l.trim(),ref:""}:{std:l.slice(0,i).trim(),ref:l.slice(i+1).trim()}}),
 nutr:s=>{const p=s.split("|").map(x=>x.trim());if(p.length<7||p.every(x=>x===""))return null;const n=i=>Number((p[i]||"0").replace(",","."))||0;return{mast:n(0),nasicene:n(1),oh:n(2),sladkorji:n(3),vlaknine:n(4),beljakovine:n(5),sol:n(6),alkohol:n(7),poliol:n(8)}},
 zrows:s=>s.split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());return{predpis:p[0]||"",mesto:p[1]||""}}),
 hrows:s=>s.split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());return{tip:p[0]||"B",nevarnost:p[1]||"",ukrep:p[2]||""}}),
 arows:s=>s.split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());return[p[0]||"",p[1]||"",p[2]||""]})
};

function renderNav(){
 const n=$("nav");n.replaceChildren();
 Object.entries(SPEC).forEach(([k,s])=>{
  const b=el("button",{class:k===cur?"on":""},el("span",{text:s.naziv+(dirty.has(k)?" *":"")}),el("small",{text:String((DB[k]||[]).length)}));
  b.onclick=()=>{cur=k;selIdx=-1;$("q").value="";hideRaw();render()};n.append(b);
 });
}
function renderTable(){
 const s=SPEC[cur],q=$("q").value.toLowerCase(),t=$("tbl");t.replaceChildren();
 const head=el("tr");s.cols.forEach(c=>head.append(el("th",{text:s.f.find(f=>f.k===c)?.l||c})));t.append(head);
 (DB[cur]||[]).forEach((r,i)=>{
  if(q&&!JSON.stringify(r).toLowerCase().includes(q))return;
  const tr=el("tr",{class:"row"+(i===selIdx?" sel":"")});
  s.cols.forEach(c=>{const v=txt(r[c]);tr.append(el("td",{text:v.length>90?v.slice(0,90)+"…":v}))});
  tr.onclick=()=>{selIdx=i;renderEdit();renderTable()};t.append(tr);
 });
}
function renderEdit(){
 const box=$("edit");
 if(selIdx<0||!DB[cur][selIdx]){box.style.display="none";return}
 const s=SPEC[cur],r=DB[cur][selIdx];box.style.display="";box.replaceChildren(el("b",{text:"Urejanje zapisa #"+(selIdx+1)}));
 const inputs={};
 s.f.forEach(f=>{
  const lab=el("label",{text:f.l});if(f.hint)lab.append(" ",el("span",{class:"hint",text:f.hint}));
  let inp;
  if(f.t==="a"||f.t==="lines"||f.t==="rows"||f.t==="arows"||f.t==="hrows"||f.t==="srows"||f.t==="zrows"){inp=el("textarea");if(f.t==="rows"||f.t==="lines"||f.t==="hrows"||f.t==="zrows")inp.style.minHeight="150px"}
  else if(f.t==="sel"){inp=el("select");f.opts.forEach(o=>inp.append(el("option",{text:o,value:o})))}
  else inp=el("input",{type:f.t==="n"?"number":"text"});
  inp.value=enc[f.t](r[f.k],f);inputs[f.k]=[inp,f];box.append(lab,inp);
 });
 const bar=el("div",{class:"bar",style:"margin-top:12px"});
 const ok=el("button",{class:"b",text:"Potrdi zapis"}),dup=el("button",{class:"s",text:"Podvoji"}),del=el("button",{class:"d",text:"Izbriši"});
 ok.onclick=()=>{const o={};for(const[k,[inp,f]]of Object.entries(inputs))o[k]=dec[f.t](inp.value);DB[cur][selIdx]=o;mark();render()};
 dup.onclick=()=>{const o=JSON.parse(JSON.stringify(DB[cur][selIdx]));DB[cur].splice(selIdx+1,0,o);selIdx++;mark();render()};
 del.onclick=()=>{if(confirm("Izbrišem ta zapis?")){DB[cur].splice(selIdx,1);selIdx=-1;mark();render()}};
 bar.append(ok,dup,del);box.append(bar);
}
function mark(){dirty.add(cur);updStatus()}
function updStatus(){
 const s=$("status");
 s.className=dirty.size?"dirty":"clean";
 s.textContent=dirty.size?"Neshranjene spremembe: "+[...dirty].map(k=>SPEC[k].naziv).join(", "):"Povezano z bazo, vse shranjeno";
 $("save").disabled=!dirty.size;
}
function hideRaw(){$("raw").style.display="none"}
function render(){$("title").textContent=SPEC[cur].naziv;renderNav();renderTable();renderEdit();updStatus()}

$("q").oninput=renderTable;
$("add").onclick=()=>{
 const o={};SPEC[cur].f.forEach(f=>o[f.k]=f.t==="tags"||f.t==="lines"||f.t==="rows"||f.t==="arows"||f.t==="hrows"||f.t==="srows"||f.t==="zrows"?[]:f.t==="nutr"?null:f.t==="sel"?f.opts[0]:"");
 DB[cur].push(o);selIdx=DB[cur].length-1;mark();render();$("edit").scrollIntoView({behavior:"smooth"});
};
$("rawb").onclick=()=>{const r=$("raw");const show=r.style.display==="none";r.style.display=show?"":"none";if(show){$("rawt").value=JSON.stringify(DB[cur],null,1);$("rawerr").textContent=""}};
$("rawok").onclick=()=>{try{const d=JSON.parse($("rawt").value);if(!Array.isArray(d))throw new Error("Zbirka mora biti seznam.");DB[cur]=d;selIdx=-1;mark();hideRaw();render()}catch(e){$("rawerr").textContent="Napaka: "+e.message}};
$("save").onclick=async()=>{
 const b=$("save");b.disabled=true;
 try{
  for(const k of [...dirty]){
   const r=await fetch("/api/baza/"+k,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(DB[k])});
   const j=await r.json();if(!r.ok)throw new Error(k+": "+(j.napaka||r.status));dirty.delete(k);
  }
  render();
 }catch(e){alert("Shranjevanje ni uspelo: "+e.message);updStatus()}
};
window.addEventListener("beforeunload",e=>{if(dirty.size){e.preventDefault();e.returnValue=""}});

async function loadHist(){
 const h=$("hist");h.replaceChildren();h.append(el("b",{text:"Posodobitve baze"}));
 try{const L=await (await fetch("/api/posodobitve")).json();
  if(!L.length)h.append(el("div",{text:"Še ni uporabljenih posodobitev."}));
  L.slice().reverse().forEach(u=>{const sm=Object.entries(u.povzetek||{}).map(([k,v])=>k+": +"+v.dodano+" ~"+v.zamenjano+" −"+v.odstranjeno).join("; ");h.append(el("div",{style:"margin-top:6px",text:(u.datum||u.id)+" · "+(u.opis||"").slice(0,110)}),el("div",{style:"opacity:.65",text:sm}))});
 }catch(e){h.append(el("div",{text:"Zgodovine ni mogoče prebrati."}))}
}
$("upd").onclick=()=>$("updf").click();
$("updf").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const u=JSON.parse(await f.text());
  const r=await fetch("/api/posodobitev",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(u)});const j=await r.json();
  if(!r.ok)throw new Error(j.napaka||r.status);
  if(j.ze_uporabljena)alert("Ta posodobitev je že uporabljena.");
  else{const sm=Object.entries(j.povzetek||{}).map(([k,v])=>k+": dodano "+v.dodano+", zamenjano "+v.zamenjano+", odstranjeno "+v.odstranjeno).join("\n");alert("Posodobitev uporabljena.\n"+sm);
   DB=await (await fetch("/api/baza")).json();dirty.clear();selIdx=-1;render();}
  loadHist();
 }catch(err){alert("Posodobitve ni mogoče uporabiti: "+err.message)}
 e.target.value="";
};
(async()=>{
 try{const r=await fetch("/api/baza");if(r.status===401){location.href="/";return}DB=await r.json();if(DB.napaka)throw new Error(DB.napaka)}
