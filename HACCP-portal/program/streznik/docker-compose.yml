# Zagon na strežniku (Linux VPS z Dockerjem):  docker compose up -d --build
# 1) V Caddyfile zamenjajte haccp.vasa-domena.si z vašo domeno (A-zapis mora kazati na IP strežnika).
# 2) Caddy samodejno uredi HTTPS (Let's Encrypt).
services:
  app:
    build:
      context: ..
      dockerfile: streznik/Dockerfile
    restart: unless-stopped
    environment:
      HACCP_PROXY: "1"                 # IP uporabnika iz X-Forwarded-For (aplikacija je dosegljiva samo prek Caddyja)
      # HACCP_POSODOBITVE_URL: "https://…/posodobitve.json"   # neobvezno: samodejne posodobitve baze znanja
      # HACCP_DOSTOPNI_DNEVNIK: "1"                            # neobvezno: dnevnik zahtevkov
    volumes:
      - data:/data
    expose: ["3000"]
    stop_grace_period: 15s
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
volumes:
  data:
  caddy_data:
